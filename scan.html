<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QINISO PUBLIC SCAN v25 - REPORT TO ALL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,serverTimestamp,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC5s3P8y4Z6-REPLACE-WITH-YOUR-REAL-KEY",authDomain:"qiniso-mark-v4.firebaseapp.com",projectId:"qiniso-mark-v4"};
const app=initializeApp(cfg); const db=getFirestore(app);
window.db=db; window.fs={collection,addDoc,serverTimestamp,doc,getDoc};
</script>
</head>
<body class="bg-black text-white p-3">
<div class="bg-yellow-400 text-black p-3 rounded-xl font-black text-center">🔍 QINISO PUBLIC SCAN v25 - REPORT TO ALL DASHBOARDS + 6 DEPTS + BRANDS</div>
<div class="mt-3 bg-white text-black rounded-xl p-3">
<div id="status" class="font-black text-center">📱 Point camera to QR</div>
<div id="gpsInfo" class="text-[11px] text-center mt-2">GPS Locking... IP detecting...</div>
<video id="video" class="w-full h-64 bg-black rounded mt-2 hidden"></video>
<canvas id="canvas" class="hidden"></canvas>
<button onclick="startScan()" id="scanBtn" class="w-full bg-black text-white p-4 rounded-xl font-black mt-3">📷 START SCAN</button>
<div id="result" class="mt-3 hidden"></div>
</div>
<script>
let currentGPS={lat:-33.84932,lng:25.45160}; let currentIP="102.214.117.64";
navigator.geolocation?.getCurrentPosition(p=>{currentGPS={lat:p.coords.latitude,lng:p.coords.longitude}; document.getElementById('gpsInfo').innerText=`GPS ${currentGPS.lat.toFixed(5)},${currentGPS.lng.toFixed(5)} | IP ${currentIP} | Ready`;});
fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{currentIP=d.ip; document.getElementById('gpsInfo').innerText=`GPS ${currentGPS.lat.toFixed(5)},${currentGPS.lng.toFixed(5)} | IP ${currentIP} | Ready`;}).catch(()=>{});
async function startScan(){ document.getElementById('video').classList.remove('hidden'); const v=document.getElementById('video'); const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); v.srcObject=s; v.play(); const c=document.getElementById('canvas'); const ctx=c.getContext('2d'); setInterval(()=>{c.width=v.videoWidth; c.height=v.videoHeight; ctx.drawImage(v,0,0); try{ const data=ctx.getImageData(0,0,c.width,c.height); /* QR decode would go here */ }catch(e){} },500); }
function calcDist(lat1,lon1,lat2,lon2){ const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
// SIMULATE SCAN FOR TEST
async function simulateScan(batch="BATCH-TEST-CLOUD-001"){
 const allocated={lat:-33.9249,lng:25.57,shop:"SPAR Bethelsdorp"}; const dist=calcDist(currentGPS.lat,currentGPS.lng,allocated.lat,allocated.lng); const isSuspected=dist>1; const status=isSuspected?"SUSPECTED ❌":"SAFE 👍"; const reason=isSuspected?`Possible robbery/duplicate - ${dist.toFixed(1)}km from ${allocated.shop}`:`Within range - ${dist.toFixed(1)}km`;
 const payload={batch,allocatedShop:allocated.shop,allocatedGPS:`${allocated.lat},${allocated.lng}`,scannedGPS:`${currentGPS.lat},${currentGPS.lng}`,scannedAt:{lat:currentGPS.lat,lng:currentGPS.lng},distanceKm:dist,status,reason,ip:currentIP,time:new Date().toISOString(),source:"public_scan",dangerousZone:"Ext 21 Bethelsdorp",courtCopy:true};
 document.getElementById('result').classList.remove('hidden'); document.getElementById('result').innerHTML=`<div class="border-4 ${isSuspected?'border-red-600':'border-green-600'} rounded-xl p-3"><div class="font-black text-lg">${status}</div><div class="text-sm">${batch}<br>Allocated: ${allocated.shop}<br>Scanned: ${currentGPS.lat.toFixed(5)},${currentGPS.lng.toFixed(5)}<br>Distance: ${dist.toFixed(1)}km<br>IP: ${currentIP}<br>Reason: ${reason}</div><div class="mt-2 text-[10px]">Pushed to: Dashboard + Brand KOO + 6 Depts + Dangerous Zones</div></div>`;
 // PUSH TO ALL 9 COLLECTIONS
 try{ const {collection,addDoc,serverTimestamp}=window.fs; const db=window.db; payload.time=serverTimestamp();
  await addDoc(collection(db,'dashboard_alerts'),payload);
  await addDoc(collection(db,'reports'),payload);
  await addDoc(collection(db,'brand_KOO'),payload);
  await addDoc(collection(db,'dept_SAPS'),payload);
  await addDoc(collection(db,'dept_HEALTH'),payload);
  await addDoc(collection(db,'dept_CIPC'),payload);
  await addDoc(collection(db,'dept_SARS'),payload);
  await addDoc(collection(db,'dept_VAT'),payload);
  await addDoc(collection(db,'dept_NCC'),payload);
  await addDoc(collection(db,'dangerous_zones'),{zone:payload.dangerousZone,gps:currentGPS,batch,dist,status,time:serverTimestamp()});
  console.log("Pushed to 10 collections");
 }catch(e){ console.log(e); }
}
window.simulateScan=simulateScan;
// Auto test your batch
setTimeout(()=>simulateScan("BATCH-TEST-CLOUD-001"),2000);
</script>
</body></html>
