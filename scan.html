<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QINISO MARK - Scan</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:15px;text-align:center}
.card{background:white;color:black;border-radius:20px;padding:20px;margin:15px 0}
#reader{width:100%;border-radius:15px;overflow:hidden}
.btn{width:100%;padding:18px;border:none;border-radius:15px;font-size:18px;font-weight:bold;margin:8px 0}
.safe{background:#16a34a;color:white}.suspect{background:#eab308;color:black}.fake{background:#dc2626;color:white}.gps{background:#1e40af;color:white}
input{width:90%;padding:15px;border-radius:10px;border:2px solid #ccc;font-size:16px;margin:10px 0}.icon{font-size:50px}
</style>
</head>
<body>
<h2>🛡️ QINISO MARK - SCAN</h2>
<div id="reader"></div>
<div class="card">
<p class="icon">⌨️</p>
<input id="manualCode" placeholder="QIN-XXXX e.g QIN-KOO-1234">
<button class="btn gps" onclick="checkCode(document.getElementById('manualCode').value)">CHECK CODE</button>
</div>
<div id="result" class="card" style="display:none"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAHRegV2vQw1Z5N3ZxQv4_example",
  authDomain: "qiniso-mark-v4.firebaseapp.com",
  projectId: "qiniso-mark-v4",
  storageBucket: "qiniso-mark-v4.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcd"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let userIP="Unknown"; let userGPS={lat:null,lng:null,address:"Unknown"};
fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{userIP=d.ip;});
fetch('https://ipapi.co/json/').then(r=>r.json()).then(d=>{userGPS.address=d.city+", "+d.region;}).catch(()=>{});
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{userGPS.lat=pos.coords.latitude;userGPS.lng=pos.coords.longitude;});}
function onScanSuccess(decodedText){html5QrcodeScanner.clear();checkCode(decodedText);}
let html5QrcodeScanner=new Html5QrcodeScanner("reader",{fps:10,qrbox:{width:250,height:250}});
html5QrcodeScanner.render(onScanSuccess);
async function checkCode(code){
 code=code.trim().toUpperCase(); if(!code){alert("Enter code!");return;}
 const resDiv=document.getElementById('result'); resDiv.style.display='block';
 resDiv.innerHTML=`<h3>⏳ Checking ${code}...</h3><p>IP: ${userIP}</p>`;
 try{
  const docSnap=await db.collection('products').doc(code).get();
  let status="FAKE"; let brand="Unknown";
  if(docSnap.exists){let data=docSnap.data();brand=data.brand||"KOO";status=data.status||"SAFE";if(data.scanned&&data.scanned>0)status="SUSPECT";await db.collection('products').doc(code).update({scanned: firebase.firestore.FieldValue.increment(1),lastScan:new Date()});}
  const report={code:code,brand:brand,result:status,ip:userIP,lat:userGPS.lat,lng:userGPS.lng,location:userGPS.address,timestamp:firebase.firestore.FieldValue.serverTimestamp(),mapLink:userGPS.lat?`https://www.google.com/maps?q=${userGPS.lat},${userGPS.lng}`:"No GPS"};
  await db.collection('reports').add(report);
  let html=""; 
  if(status=="SAFE"){html=`<p class="icon">✅</p><h1 style="color:#16a34a">REAL - SAFE</h1><h2>${brand} - ${code}</h2><button class="btn safe">✔️ OK TO EAT</button><p><a href="${report.mapLink}" target="_blank">📍 View Map</a></p>`;}
  else if(status=="SUSPECT"){html=`<p class="icon">⚠️</p><h1 style="color:#ca8a04">SUSPECT!</h1><h2>${brand}</h2><button class="btn suspect">⚠️ CHECKED BEFORE</button><p>IP: ${userIP}</p><p><a href="${report.mapLink}" target="_blank">📍 Map: ${report.location}</a></p>`;}
  else{html=`<p class="icon">☠️</p><h1 style="color:#dc2626">FAKE - DO NOT EAT!</h1><h2>${code}</h2><button class="btn fake">🚨 REPORT TO SAPS</button><p>IP: ${userIP} saved</p><p>GPS: ${userGPS.lat}, ${userGPS.lng}</p><p><a href="${report.mapLink}" target="_blank">📍 FAKE Location</a></p><button class="btn gps" onclick="window.open('inspection.html?code=${code}','_blank')">📋 SAPS Form</button>`;}
  resDiv.innerHTML=html;
 }catch(e){resDiv.innerHTML=`<h2 style="color:red">Error: ${e.message}</h2>`;}
}
</script>
</body>
</html>
