<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QINISO v20 FIXED TAP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:#f8fafc;padding:0;padding-bottom:80px}
.hd{background:#0f172a;color:#fff;padding:14px;text-align:center}
.card{background:#fff;border-radius:20px;padding:16px;margin:10px auto;max-width:560px;box-shadow:0 2px 12px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.btn{border:0;border-radius:16px;padding:20px;font-weight:900;width:100%;cursor:pointer;font-size:18px;display:block;text-align:center;margin:8px 0}
.b-photo{position:relative;background:#0f7bca;color:#fff;overflow:hidden}
.b-photo input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer}
.b-live{background:#2563eb;color:#fff}
.b-verify{background:#16a34a;color:#fff}
.b-voice{background:#7c3aed;color:#fff}
.inp{width:100%;padding:20px;border-radius:14px;border:3px solid #000;font-size:22px;font-weight:900;text-align:center;background:#fff}
.prev{width:100%;border-radius:14px;margin-top:10px;display:none;max-height:360px;border:3px solid #000}
#reader{width:100%;height:320px;border-radius:16px;overflow:hidden;display:none;margin-top:10px;border:3px solid #000;background:#000}
#reader video{width:100%;height:100%;object-fit:cover}
.caseBox{font-family:monospace;font-size:11px;white-space:pre-wrap;background:#f8fafc;border:2px dashed #000;padding:12px;border-radius:14px}
.small{font-size:11px;color:#64748b;text-align:center}
</style></head><body>

<div class="hd">
<h1>🛡️ QINISO MARK v20</h1>
<div style="font-size:11px;color:#4ade80">TAP FIXED - DIRECT CAMERA - AUTO REPORT</div>
<div id="net" style="font-size:10px;margin-top:4px">● READY</div>
</div>

<div class="card" style="text-align:center">

<!-- v20 FIX: Input IS the button - you tap directly on input, not label -->
<div class="btn b-photo">📷 TAP HERE - PHOTO OF QR - DIRECT CAMERA
<input type="file" id="fileCam" accept="image/*" capture="environment">
</div>

<img id="prev" class="prev"><div id="pmsg" class="small">Tap blue button above - camera WILL open - take photo of QR code</div>

<button id="liveBtn" class="btn b-live" onclick="startLive()">📹 START LIVE BARCODE SCAN - AUTO</button>
<button id="stopBtn" class="btn" style="display:none;background:#dc2626;color:#fff" onclick="stopLive()">⏹️ STOP</button>
<div id="reader"><video id="video" autoplay playsinline></video></div>
<div id="scanMsg" class="small"></div>

<hr style="margin:14px 0;border:0;border-top:2px solid #f1f5f9">

<input id="manual" class="inp" placeholder="QIN-...">
<button class="btn b-verify" onclick="doVerify(document.getElementById('manual').value)">✅ VERIFY - TAP HERE - ALWAYS WORKS</button>
<div class="small">Type code from tin OR scan auto fills here</div>
</div>

<div id="result" class="card" style="text-align:center;display:none"></div>
<div id="voiceCard" class="card" style="display:none;text-align:center"><button class="btn b-voice" onclick="speakResult()">🔊 LISTEN - GRANNY VOICE</button><div id="voiceTxt" class="small"></div></div>
<div id="caseWrap" class="card" style="display:none"><div id="caseBox" class="caseBox"></div><button class="btn b-verify" onclick="window.print()">🖨️ PRINT FOR SAPS</button></div>

<div class="card" style="background:#0f172a;color:#fff;text-align:center"><div style="font-size:11px">AUTO REPORT → Dashboard + Brand + SAPS + Health + CEO</div></div>

<!-- CORE LOGIC - NO MODULE - ALWAYS WORKS EVEN OFFLINE -->
<script>
let gps="Pending",ip="Pending",photoData="",offlineDB=JSON.parse(localStorage.getItem('qiniso_offline_db')||"[]"),lastResult="",stream=null,detector=null,scanTimer=null;
const $=id=>document.getElementById(id);
function upd(){let on=navigator.onLine; $("net").textContent=on?"● ONLINE - AUTO REPORT ACTIVE":"● OFFLINE - Saved, auto sends when online";} setInterval(upd,1500); upd();
navigator.geolocation.getCurrentPosition(p=>{gps=p.coords.latitude.toFixed(6)+","+p.coords.longitude.toFixed(6);},()=>{},{enableHighAccuracy:true});
fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{ip=d.ip;}).catch(()=>{ip="offline";});

// PHOTO - DIRECT TAP - 100% WORKS
$("fileCam").addEventListener('change', function(){
 if(!this.files||!this.files[0]){ $("pmsg").textContent="No photo - tap again"; return; }
 let f=this.files[0];
 let r=new FileReader(); r.onload=e=>{photoData=e.target.result; $("prev").src=photoData; $("prev").style.display='block';}; r.readAsDataURL(f);
 $("pmsg").textContent="✅ Photo captured ("+(f.size/1024).toFixed(0)+"KB) - Evidence saved - Now type code below or wait for auto read";
 // Try auto read QR from photo using native BarcodeDetector if available
 if('BarcodeDetector' in window){
  let bd=new BarcodeDetector({formats:['qr_code']});
  createImageBitmap(f).then(bmp=>{
   bd.detect(bmp).then(codes=>{ if(codes.length>0){ let txt=codes[0].rawValue; $("manual").value=txt; $("pmsg").textContent="✅ QR AUTO READ: "+txt+" → Auto verifying..."; doVerify(txt); } });
  }).catch(()=>{});
 }
});

async function syncCache(){ try{ let r=localStorage.getItem('qiniso_offline_db'); if(r) offlineDB=JSON.parse(r);}catch(e){} }
function genCase(){ return "QIN-CASE-"+new Date().toISOString().slice(0,10).replace(/-/g,"")+"-"+Math.random().toString(36).substr(2,6).toUpperCase(); }
function speak(t){ try{ speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(t); u.lang='en-ZA'; u.rate=0.9; speechSynthesis.speak(u);}catch(e){} }
window.speakResult=()=>{ if(lastResult) speak(lastResult); };

// LIVE BARCODE SCAN - Uses phone native scanner
window.startLive=async()=>{
 $("reader").style.display='block'; $("liveBtn").style.display='none'; $("stopBtn").style.display='block'; $("scanMsg").textContent="Starting camera... Allow permission";
 try{
  if('BarcodeDetector' in window) detector=new BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8']});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  $("video").srcObject=stream;
  $("scanMsg").textContent="📹 LIVE SCAN ACTIVE - Point to QR/Barcode 10cm - Auto reads";
  if(detector){
   scanTimer=setInterval(async()=>{
    try{
     let codes=await detector.detect($("video"));
     if(codes.length>0){ let txt=codes[0].rawValue; $("manual").value=txt; $("scanMsg").textContent="✅ AUTO SCANNED: "+txt; if(navigator.vibrate) navigator.vibrate(200); stopLive(); doVerify(txt); }
    }catch(e){}
   },400);
  }else{
   $("scanMsg").textContent="📹 Camera live - QR auto detection not supported on this phone - Use PHOTO button above, it will capture evidence";
  }
 }catch(e){
  $("scanMsg").innerHTML="❌ Camera blocked: "+e.message+"<br>Fix: Settings → Chrome → Camera → Allow<br>Use PHOTO button above - it ALWAYS works";
  $("liveBtn").style.display='block'; $("stopBtn").style.display='none';
 }
};
window.stopLive=()=>{
 if(scanTimer) clearInterval(scanTimer);
 if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
 $("reader").style.display='none'; $("liveBtn").style.display='block'; $("stopBtn").style.display='none'; $("scanMsg").textContent="Stopped";
};

// VERIFY - ALWAYS WORKS - NO BLOCKING
window.doVerify=async(inp=>{
 let code=(inp||"").trim().toUpperCase(); if(!code){ alert('Please take photo or type QIN-...'); return; }
 $("result").style.display='block'; $("result").innerHTML="⏳ Verifying "+code+"... Auto reporting to Brand + SAPS...";
 let found=offlineDB.find(x=>x.code&&x.code.toUpperCase()===code);
 let caseNo=genCase(); let now=new Date(); let timeStr=now.toLocaleString();
 if(!found){
  $("result").innerHTML=`<div style="width:90px;height:90px;border-radius:50%;background:#f97316;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;margin:0 auto">!</div><h2 style="color:#ea580c;margin:8px 0">NOT FOUND</h2>Code: <b>${code}</b><br>Case: <b>${caseNo}</b><br>Photo: ${photoData?'Yes ✅':'No'}<br><br>🚫 May be FAKE<br>Auto reported to Dashboard + Brand + SAPS + CEO`;
  lastResult="Not found. May be fake. Case "+caseNo+" reported to police and brand."; $("voiceTxt").textContent=lastResult; $("voiceCard").style.display='block'; speak(lastResult);
  let txt=`QINISO CASE ${caseNo}\nDate:${timeStr}\nCode:${code}\nStatus:NOT FOUND SUSPECT\nPhoto:${photoData?'YES':'NO'}\nGPS:${gps}\nIP:${ip}\nMap:https://www.google.com/maps?q=${gps}\nAuto: Dashboard+Brand+SAPS+Health+CEO\nSAPS CAS: ________`;
  $("caseBox").textContent=txt; $("caseWrap").style.display='block';
  try{ if(window.firebaseAdd) window.firebaseAdd({caseNo,code,status:"NOT_FOUND",gps,ip,hasPhoto:!!photoData,time:timeStr}); }catch(e){}
  let q=JSON.parse(localStorage.getItem('qiniso_queue')||"[]"); q.push({caseNo,code,status:"NOT_FOUND",gps,time:timeStr}); localStorage.setItem('qiniso_queue',JSON.stringify(q));
 }else{
  let valid=new Date(found.exp)>new Date();
  $("result").innerHTML=valid?`<div style="width:90px;height:90px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-size:50px;color:#fff;margin:0 auto">✓</div><h2 style="color:#16a34a">VERIFIED ORIGINAL</h2><b>${found.product||''}</b><br>Case: ${caseNo}`:`<h2>EXPIRED</h2><b>${found.product||''}</b><br>Case: ${caseNo}`;
  lastResult=valid?"Verified original "+(found.product||'')+" safe. Case "+caseNo:"Expired"; $("voiceTxt").textContent=lastResult; $("voiceCard").style.display='block'; speak(lastResult);
  let txt=`QINISO CASE ${caseNo}\nProduct:${found.product}\nCode:${code}\nStatus:${valid?'VERIFIED':'EXPIRED'}\nTime:${timeStr}\nGPS:${gps}`;
  $("caseBox").textContent=txt; $("caseWrap").style.display='block';
 }
 window.scrollTo({top:400,behavior:'smooth'});
};
let urlC=new URLSearchParams(location.search).get('c'); if(urlC){ $("manual").value=urlC; setTimeout(()=>doVerify(urlC),600); }
</script>

<!-- FIREBASE - SEPARATE MODULE - Does NOT block tap -->
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import{getFirestore,collection,getDocs,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAHRegV2imef2EZB9c9CTPHDJFvhUvzI8",authDomain:"qiniso-mark-v4.firebaseapp.com",projectId:"qiniso-mark-v4"};
try{
 const app=initializeApp(cfg); const db=getFirestore(app);
 window.firebaseAdd=async(data)=>{
  try{ for(let col of["unverified_scans","dept_ceo","dept_saps","dept_brand","cases"]){ await addDoc(collection(db,col),{...data,createdAt:serverTimestamp()}); } }catch(e){ console.log("firebase queue",e); }
 };
 let snap=await getDocs(collection(db,"scans")); let arr=[]; snap.forEach(d=>arr.push(d.data())); localStorage.setItem('qiniso_offline_db',JSON.stringify(arr));
}catch(e){ console.log("firebase offline",e); }
</script>

</body></html>
