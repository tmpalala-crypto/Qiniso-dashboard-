<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:10px}
.card{background:white;border-radius:15px;padding:20px;margin:10px 0;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
input,select,textarea{width:95%;padding:14px;margin:8px 0;border-radius:10px;border:2px solid #ddd;font-size:16px}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:18px;font-weight:bold;margin:6px 0}
.blue{background:#1e40af;color:white}.red{background:#dc2626;color:white}.green{background:#16a34a;color:white}
#mapLink{color:blue;word-break:break-all}
@media print{.noPrint{display:none} body{background:white}}
</style>
</head>
<body>

<h3>📍 Auto-Trace (Cannot be faked)</h3>
<p><b>Code:</b> <span id="code">Loading...</span></p>

<p><b>GPS:</b> <span id="gps">Loading...</span></p>
<p><b>Location:</b> <span id="addr">Loading...</span></p>
<p><b>Map:</b> <a id="mapLink" href="#" target="_blank">Open Google Maps</a></p>
<p><b>Date:</b> <span id="date"></span></p>
</div>
