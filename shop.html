<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QINISO SHOP APP</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="manifest" href="manifest-shop.json">
</head><body class="bg-[#0f0f0f] p-4">
<div class="bg-black border-2 border-green-500 rounded-2xl p-4 text-center"><div class="text-green-400 font-black">🏪 SHOP APP - STOCK CHECK</div></div>
<div class="bg-white rounded-2xl p-4 mt-4 text-center">
<button onclick="startShopScan()" class="w-full bg-black text-white font-black p-4 rounded-xl">📷 SCAN STOCK</button>
<div id="reader" class="mt-3"></div><div id="res" class="font-black mt-3"></div>
</div>
<script>
function startShopScan(){let qr=new Html5Qrcode("reader");qr.start({facingMode:"environment"},{fps:10,qrbox:250},d=>{qr.stop();document.getElementById('res').innerText='✅ '+d+' - Stock OK';},()=>{});}
</script></body></html>
