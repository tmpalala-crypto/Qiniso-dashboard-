<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QINISO BRAND PORTAL CLOUD</title>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import{getFirestore,collection,query,where,orderBy,onSnapshot}from"https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAHRegV2imef2EZB9c9CTPHDJFvhUvzI8",authDomain:"qiniso-mark-v4.firebaseapp.com",projectId:"qiniso-mark-v4"};
const app=initializeApp(cfg);const db=getFirestore(app);
window.db=db;window.col=collection;window.q=query;window.where=where;window.orderBy=orderBy;window.onSnapshot=onSnapshot;
</script>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#f1f5f9;padding:10px}.top{background:#0f172a;color:#fff;padding:12px;border-radius:16px}.card{background:#fff;border-radius:12px;padding:12px;margin:8px 0}.btn{border:0;border-radius:10px;padding:10px;font-weight:800;width:100%;cursor:pointer}.btn-blue{background:#1d4ed8;color:#fff}.item{border-left:5px solid #16a34a;background:#f8fafc;padding:8px;margin:6px 0;border-radius:8px}</style></head><body>
<div class="top"><b>🏭 BRAND PORTAL CLOUD - 50 BRANDS</b><div style="font-size:9px">Each brand sees own stock only - Cloud Live</div></div>
<div class="card" id="login"><h3>Login Brand</h3><select id="brand" style="width:100%;padding:10px"><option>KOO</option><option>COCA-COLA</option><option>SASKO</option><option>LUCKY STAR</option><option>ALL GOLD</option><option>BLACK CAT</option><option>BULL BRAND</option><option>IWISA</option><option>FATTIS & MONIS</option><option>HULETTS</option><option>QINISO ADMIN</option></select><input id="pass" type="password" placeholder="brandname123 e.g. koo123" style="width:100%;padding:10px;margin-top:6px"><button class="btn btn-blue" onclick="login()">LOGIN CLOUD</button></div>
<div class="card" id="dash" style="display:none"><h3 id="title"></h3><div style="font-size:11px">Cloud QR: <span id="count">0</span> | Shop: <span id="shopCount">0</span></div><div id="feed"></div><button class="btn" style="background:#e2e8f0;margin-top:8px" onclick="location.href='qr-factory.html'">Go to Factory to Generate</button></div>
<script>
let brand="";function login(){let b=document.getElementById('brand').value;let p=document.getElementById('pass').value.toLowerCase();let exp=b.replace(/[^a-z0-9]/g,'')+'123';if(p===exp||p==='qiniso2024!'||p==='qinisoadmin123'){brand=b;document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('title').textContent='🏭 '+b+' CLOUD STOCK';loadCloud();}else{alert('Wrong! Use '+exp);}}
function loadCloud(){let qq=window.q(window.col(window.db,"scans"),window.where("brand","==",brand),window.orderBy("createdAt","desc"));window.onSnapshot(qq,(snap)=>{let arr=[];snap.forEach(d=>arr.push(d.data()));document.getElementById('count').textContent=arr.length;let shops=new Set(arr.map(x=>x.shop));document.getElementById('shopCount').textContent=shops.size;document.getElementById('feed').innerHTML=arr.map(o=>`<div class="item"><b>${o.code}</b><br/>${o.product} | Batch ${o.batch} | Exp ${o.exp}<br/>Shop ${o.shop} ${o.branch} | ${o.time||''}<br/><span style="font-size:9px">${o.antiHash||''}</span></div>`).join('')||'No cloud QR yet - Generate in Factory';});let local=JSON.parse(localStorage.getItem('qiniso_qr_db')||'[]').filter(x=>x.brand===brand);if(local.length>0){document.getElementById('feed').innerHTML+=local.map(o=>`<div class="item" style="border-left-color:#ea580c"><b>${o.code} (LOCAL)</b><br/>${o.product}</div>`).join('');}}
</script></body></html>
