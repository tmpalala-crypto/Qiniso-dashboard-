<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QINISO CEO CLOUD v4</title>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import{getFirestore,collection,orderBy,query,onSnapshot,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAHRegV2imef2EZB9c9CTPHDJFvhUvzI8",authDomain:"qiniso-mark-v4.firebaseapp.com",projectId:"qiniso-mark-v4"};
const app=initializeApp(cfg);const db=getFirestore(app);
window.db=db;window.col=collection;window.q=query;window.orderBy=orderBy;window.onSnapshot=onSnapshot;window.addDoc=addDoc;window.serverTimestamp=serverTimestamp;
if(new URLSearchParams(location.search).get('unlock')==='QINISO2024!'){localStorage.clear();alert('UNLOCKED!');location.href='./';}
</script>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#0f172a;color:#fff;padding:12px}.card{background:#fff;color:#000;border-radius:12px;padding:12px;margin:8px 0}.btn{border:0;border-radius:10px;padding:10px;font-weight:800;width:100%;cursor:pointer}.btn-blue{background:#1d4ed8;color:#fff}.item{background:#f8fafc;padding:8px;margin:6px 0;border-radius:8px;border-left:5px solid #16a34a}</style></head><body>
<div style="font-weight:900;font-size:20px">🛡️ QINISO CEO CLOUD DASHBOARD v4.0 LIVE</div><div style="font-size:10px;color:#93c5fd">Firestore: qiniso-mark-v4 | Collection: scans | No Block Shield</div>
<div id="login" class="card" style="max-width:400px;margin:20px auto"><h3>CEO LOGIN</h3><input id="p" type="password" placeholder="QINISO2024!" style="width:100%;padding:10px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px"><button class="btn btn-blue" onclick="if(document.getElementById('p').value==='QINISO2024!'){document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';load();}else alert('Wrong!')">LOGIN CLOUD</button><div style="font-size:10px;margin-top:6px">If blocked, add ?unlock=QINISO2024! to URL</div></div>
<div id="dash" style="display:none"><div class="card">☁️ Cloud QR Total: <b id="cnt">0</b> | Shops: <b id="shops">0</b> | <span id="status">Connecting...</span></div><div id="feed"></div><button class="btn btn-blue" onclick="location.href='qr-factory.html'">+ Go to QR Factory</button></div>
<script>
function load(){let qq=window.q(window.col(window.db,"scans"),window.orderBy("createdAt","desc"));window.onSnapshot(qq,(snap)=>{let arr=[];snap.forEach(d=>arr.push(d.data()));document.getElementById('cnt').textContent=arr.length;let s=new Set(arr.map(x=>x.shop));document.getElementById('shops').textContent=s.size;document.getElementById('status').textContent='LIVE CLOUD '+new Date().toLocaleTimeString();document.getElementById('feed').innerHTML=arr.map(o=>`<div class="card item"><b>${o.code}</b><br/>${o.product} | ${o.brand} | Batch ${o.batch} | Exp ${o.exp}<br/>🏪 ${o.shop} ${o.branch} | ${o.time||''}<br/><span style="font-size:9px;color:#16a34a">${o.antiHash||''}</span></div>`).join('')||'<div class="card">No cloud QR yet - Generate in Factory BATCH-TEST-CLOUD</div>';let local=JSON.parse(localStorage.getItem('qiniso_qr_db')||'[]');if(local.length>0)document.getElementById('feed').innerHTML+=local.map(o=>`<div class="card item" style="border-left-color:#ea580c"><b>${o.code} (PHONE LOCAL)</b> ${o.product}</div>`).join('');});}
</script></body></html>
