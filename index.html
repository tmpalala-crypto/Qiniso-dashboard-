<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QINISO GOGO PRO - SAFE SCAN V6</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAHRegV2imef2EZbr9cCTPHDJDfvhUvzi8",
  authDomain: "qiniso-mark-v4.firebaseapp.com",
  projectId: "qiniso-mark-v4",
  storageBucket: "qiniso-mark-v4.firebasestorage.app",
  messagingSenderId: "519121640224",
  appId: "1:519121640224:web:f516bddbc5281e06fa9545",
  measurementId: "G-LDDNVQDSB5"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db=db; window.f={collection,addDoc,serverTimestamp};
</script>
<style>body{font-family:Inter,sans-serif;background:#f8fafc}.gogo-big{width:95%;margin:12px auto;padding:20px 10px;border-radius:20px;border:none;font-weight:900;display:block;font-size:28px}</style>
</head>
<body class="p-2">
<div class="bg-white border-2 border-[#0f1e3d] rounded-[20px] p-3 shadow-xl">
<div class="font-black text-center text-[#0f1e3d]">QINISO MARK - GOGO PRO V6 ✅</div>
<div class="text-[9px] text-center text-green-700 font-black">SAPS 2024/4410 • Firebase LIVE qiniso-mark-v4</div>

<!-- AGE SELECTOR - NOW BIG AND VISIBLE! -->
<div class="mt-3 bg-yellow-100 border-2 border-yellow-500 rounded-xl p-3">
<div class="font-black text-[12px] text-center mb-2">👇 SELECT YOUR AGE GROUP 👇</div>
<div class="grid grid-cols-2 gap-2">
<select id="langSelect" class="border-2 border-black rounded-xl p-3 text-[11px] font-black bg-white">
<option value="en">🌍 ENGLISH</option><option value="zu">🇿🇦 isiZULU</option><option value="xh">🇿🇦 isiXHOSA</option><option value="af">🇿🇦 AFRIKAANS</option>
</select>
<select id="ageSelect" onchange="changeAge()" class="border-4 border-green-600 rounded-xl p-3 text-[12px] font-black bg-green-50">
<option value="adult">👤 ADULT 18+</option>
<option value="gogo">👵 GOGO 60+ - BIG TEXT</option>
<option value="youth">🧒 YOUTH</option>
<option value="child">👶 CHILD</option>
</select>
</div>
</div>

<div id="youthScreen" class="mt-3">
<div class="bg-blue-50 border-2 border-green-500 rounded-xl p-3 text-center font-black text-[11px]">📸 SCAN PRODUCT - CHECK SAFETY</div>
<div class="mt-2 bg-[#0f1e3d] text-white rounded-xl p-3 text-[9px]"><div id="autoGps">GPS: Getting...</div><div id="autoIp">IP: Getting...</div><div id="autoDate"></div></div>
<button onclick="startScanMain()" class="w-full mt-3 bg-yellow-400 border-2 border-black text-black font-black text-[14px] p-4 rounded-2xl">🔍 TAP TO SCAN</button>
<div id="reader" class="mt-3"></div><div id="result" class="mt-3 font-black text-center"></div>
<div id="feelBox" style="display:none; margin-top:12px; background:white; border:3px solid #FFC107; border-radius:16px; padding:12px; text-align:center;">
<div class="font-black">How do you feel?</div>
<div class="flex gap-2 justify-center my-2"><button onclick="setFeel('safe')" class="bg-green-100 border-2 border-green-600 rounded-xl p-2">😊 SAFE</button><button onclick="setFeel('concern')" class="bg-orange-100 border-2 border-orange-600 rounded-xl p-2">😟 CONCERN</button><button onclick="setFeel('unsafe')" class="bg-red-100 border-2 border-red-600 rounded-xl p-2">⚠️ UNSAFE</button></div>
<textarea id="commentInput" placeholder="Write experience..." class="w-full border-2 border-black rounded-xl p-2 text-[12px]"></textarea>
<button onclick="saveFeeling()" class="w-full mt-2 bg-black text-white font-black p-3 rounded-xl">📤 SEND</button><div id="feelMsg" class="text-[11px] font-black mt-2"></div>
</div>
</div>

<div id="gogoScreen" style="display:none; background:#FFF8E1; border:4px solid #2E7D32; border-radius:20px; margin-top:12px; padding-bottom:20px;">
<div style="background:#2E7D32;color:white;padding:20px;font-size:32px;font-weight:900;text-align:center;border-radius:16px 16px 0 0;">QINISO<br>FOR GOGO 👵🏾</div>
<div style="font-size:26px;margin:15px;color:#000;font-weight:900;text-align:center">Sawubona Gogo! ❤️<br>Tapha apha ujonge ukutya</div>
<button onclick="startScanGogo()" class="gogo-big" style="background:#00C853;color:white">📷 SCAN - Jonga Ukutya</button>
<div id="readerGogo" style="width:95%;margin:auto;border-radius:20px;overflow:hidden"></div>
<div id="resultGogo" style="font-size:26px;font-weight:900;text-align:center;margin:15px"></div>
<div id="feelBoxGogo" style="display:none; margin:12px; background:white; border:4px solid #FFC107; border-radius:20px; padding:15px; text-align:center;">
<div style="font-size:22px;font-weight:900;">Uziva njani Gogo?</div>
<div style="display:flex; gap:10px; justify-content:center; margin:12px 0;">
<button onclick="setFeelGogo('safe')" style="font-size:28px; background:#E8F5E9; border-radius:16px; padding:10px; border:3px solid #4CAF50;">😊</button>
<button onclick="setFeelGogo('concern')" style="font-size:28px; background:#FFF3E0; border-radius:16px; padding:10px; border:3px solid #FF9800;">😟</button>
<button onclick="setFeelGogo('unsafe')" style="font-size:28px; background:#FFEBEE; border-radius:16px; padding:10px; border:3px solid #F44336;">⚠️</button>
</div>
<textarea id="commentInputGogo" placeholder="Bhala apha Gogo..." style="width:100%; border:3px solid #2E7D32; border-radius:12px; padding:12px; font-size:18px;"></textarea>
<button onclick="saveFeelingGogo()" class="gogo-big" style="background:#0f1e3d; color:white; font-size:20px;">📤 THUMELA</button>
<div id="feelMsgGogo" style="font-size:16px; font-weight:900;"></div>
</div>
</div>
</div>
</div>

<script>
let selectedFeel = ""; let selectedFeelGogo = ""; window.lastBarcode = "";
function changeAge(){
  let age=document.getElementById('ageSelect').value;
  if(age==='gogo'){ document.getElementById('youthScreen').style.display='none'; document.getElementById('gogoScreen').style.display='block'; } else { document.getElementById('gogoScreen').style.display='none'; document.getElementById('youthScreen').style.display='block'; }
}
navigator.geolocation.getCurrentPosition(p=>{ document.getElementById('autoGps').innerText="GPS: "+p.coords.latitude.toFixed(5)+", "+p.coords.longitude.toFixed(5); });
fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>{document.getElementById('autoIp').innerText="IP: "+d.ip;});
document.getElementById('autoDate').innerText=new Date().toLocaleString();
function startScanMain(){
  let qr=new Html5Qrcode("reader");
  qr.start({facingMode:"environment"}, {fps:10, qrbox:250}, async (decoded)=>{
      qr.stop(); window.lastBarcode = decoded; document.getElementById('result').innerHTML='🔍 Checking: '+decoded; document.getElementById('feelBox').style.display='block';
      try{ await window.f.addDoc(window.f.collection(window.db,"customer_scans"),{barcode:decoded,ageGroup:document.getElementById('ageSelect').value,timestamp:window.f.serverTimestamp()}); document.getElementById('result').innerHTML='✅ Scanned: '+decoded+' - Saved to Firebase!'; }catch(e){ document.getElementById('result').innerHTML='❌ '+e.message; }
    },()=>{});
}
function startScanGogo(){
  let qr=new Html5Qrcode("readerGogo");
  qr.start({facingMode:"environment"}, {fps:10, qrbox:300}, async (decoded)=>{
      qr.stop(); window.lastBarcode = decoded; document.getElementById('resultGogo').innerHTML='⏳ '+decoded; document.getElementById('feelBoxGogo').style.display='block';
      try{ await window.f.addDoc(window.f.collection(window.db,"customer_scans"),{barcode:decoded,ageGroup:"gogo",timestamp:window.f.serverTimestamp()}); document.getElementById('resultGogo').innerHTML='✅ KULUNGILE Gogo! '+decoded; }catch(e){ document.getElementById('resultGogo').innerHTML='❌ '+e.message; }
    },()=>{});
}
function setFeel(f){ selectedFeel = f; }
function setFeelGogo(f){ selectedFeelGogo = f; }
async function saveFeeling(){
  let c=document.getElementById('commentInput').value; document.getElementById('feelMsg').innerText="Saving...";
  try{ await window.f.addDoc(window.f.collection(window.db,"customer_feelings"),{feeling:selectedFeel,comment:c,barcode:window.lastBarcode,timestamp:window.f.serverTimestamp()}); document.getElementById('feelMsg').innerText="✅ Saved!"; }catch(e){ document.getElementById('feelMsg').innerText="❌ "+e.message; }
}
async function saveFeelingGogo(){
  let c=document.getElementById('commentInputGogo').value; document.getElementById('feelMsgGogo').innerText="Saving...";
  try{ await window.f.addDoc(window.f.collection(window.db,"customer_feelings"),{feeling:selectedFeelGogo,comment:c,barcode:window.lastBarcode,ageGroup:"gogo",timestamp:window.f.serverTimestamp()}); document.getElementById('feelMsgGogo').innerText="✅ Enkosi Gogo!"; }catch(e){ document.getElementById('feelMsgGogo').innerText="❌ "+e.message; }
}
</script>
</body></html>
